{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} item{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">{{ 'Edit' if item else 'Add' }} menu item</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" name="description" class="form-control" value="{{ item.description if item and item.description else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Price (R)</label>
        <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ item.price if item else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-select" required>
          {% for c in categories %}
          <option value="{{ c.id }}" {{ 'selected' if item and item.category_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="available" id="available"
               {{ 'checked' if (item is none or item.available) }}>
        <label class="form-check-label" for="available">Available on the menu</label>
      </div>
      <button class="btn btn-dark">Save</button>
      <a href="{{ url_for('admin.menu') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
